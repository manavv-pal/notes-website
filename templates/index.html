<!DOCTYPE html>
<html>

<head>
    <title>Diary App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="light">

    <div class="container">

        <h2>📔 My Diary</h2>
        <h3>Welcome, {{ session.username }} 👋</h3>
        <a href="/logout">
            <button>Logout 🚪</button>
        </a>
        <button onclick="toggleMode()">🌙 Toggle Mode</button>

        <br><br>

        <input type="text" id="searchInput" placeholder="Search diary...">

        <button onclick="filterCategory('All')">All</button>
        <button onclick="filterCategory('Personal')">Personal</button>
        <button onclick="filterCategory('Study')">Study</button>
        <button onclick="filterCategory('Work')">Work</button>
        <br><br>

        <form method="POST">
            <input type="text" name="title" placeholder="Title"><br><br>
            <textarea name="content" placeholder="type here ..." rows="4"></textarea><br><br>
            <select name="category">
                <option value="Personal">Personal 😄</option>
                <option value="Study">Study 📚</option>
                <option value="Work">Work 💼</option>
            </select>
            <br><br>
            <button type="submit">Save Entry</button>
        </form>

        <hr>

        {% for note in notes %}

        <div class="note" data-title="{{ note[1] }}" data-content="{{ note[2] }}" data-category="{{ note[5] }}">

            <h3>{{ note[1] }}</h3>
            <p>{{ note[2] }}</p>
            <small>{{ note[3] }}</small>
            <b>Category:</b> {{ note[5] }}
            <br>
            <br>

            <a href="/favorite/{{ note[0] }}">
                {% if note[4] == 1 %}
                ⭐
                {% else %}
                ☆
                {% endif %}
            </a>

            <a href="/edit/{{ note[0] }}">📝</a>

            <a href="/delete/{{ note[0] }}" onclick="return confirm('Delete this note?')">🗑️</a>

        </div>

        {% endfor %}

    </div>

    <script>

        // DARK MODE
        function toggleMode() {
            document.body.classList.toggle("dark");
            document.body.classList.toggle("light");
        }

        // LIVE SEARCH
        const searchInput = document.getElementById("searchInput");

        searchInput.addEventListener("keyup", function () {

            let value = this.value.toLowerCase();
            let notes = document.querySelectorAll(".note");

            notes.forEach(note => {

                let title = note.getAttribute("data-title").toLowerCase();
                let content = note.getAttribute("data-content").toLowerCase();

                if (title.includes(value) || content.includes(value)) {
                    note.style.display = "block";
                } else {
                    note.style.display = "none";
                }

            });

        });

        function filterCategory(category) {

            let notes = document.querySelectorAll(".note");

            notes.forEach(note => {

                let noteCat = note.getAttribute("data-category");

                if (category === "All" || noteCat === category) {
                    note.style.display = "block";
                } else {
                    note.style.display = "none";
                }

            });

        }

    </script>

</body>

</html>
